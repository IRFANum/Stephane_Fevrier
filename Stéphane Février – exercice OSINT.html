<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18191a;--card:#242526;--tx:#e4e6eb;--mut:#b0b3b8;--blue:#4599ff;--line:#3e4042}}
:root[data-theme="dark"]{--bg:#18191a;--card:#242526;--tx:#e4e6eb;--mut:#b0b3b8;--blue:#4599ff;--line:#3e4042}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px}
a{color:inherit}
/* Landing */
.lt{max-width:440px;margin:0 auto;padding:40px 20px;text-align:center}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(135deg,#8ab4f8,#5f6caf);font-size:1.1em}
.lt .av{width:110px;height:110px;font-size:56px;border:4px solid var(--card)}
.lt h1{margin:14px 0 4px}.lt p{color:var(--mut);margin:0 0 26px}
.btn{display:block;padding:16px;margin:12px 0;border-radius:14px;color:#fff;text-decoration:none;font-weight:600;font-size:17px}
.b-fb{background:#1877f2}.b-ig{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)}.b-in{background:#0a66c2}
.off{opacity:.45;pointer-events:none}
.foot{margin-top:40px;font-size:12px;color:var(--mut)}
/* Facebook */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 16px}
.top b{color:var(--blue);font-size:26px;letter-spacing:-1px}
.top .s{flex:1;background:var(--bg);border-radius:20px;padding:8px 14px;color:var(--mut);max-width:260px}
.top a{margin-left:auto;text-decoration:none;color:var(--mut);font-size:13px}
.wrap{max-width:940px;margin:0 auto}
.cover{height:190px;background:linear-gradient(120deg,#5c7cfa,#22b8cf 60%,#94d82d);border-radius:0 0 10px 10px}
.head{background:var(--card);padding:0 20px 12px;border-radius:0 0 10px 10px;margin-bottom:14px}
.head .av{width:130px;height:130px;font-size:66px;margin-top:-65px;border:4px solid var(--card)}
.head h2{margin:8px 0 2px;font-size:26px}.head small{color:var(--mut)}
.tabs{display:flex;gap:18px;border-top:1px solid var(--line);margin-top:12px;padding-top:10px;color:var(--mut);font-weight:600;overflow-x:auto}
.tabs span:first-child{color:var(--blue)}
.cols{display:grid;grid-template-columns:340px 1fr;gap:14px;padding:0 8px}

.card{background:var(--card);border-radius:10px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.15);overflow:hidden}
.card h3{margin:0 0 10px;font-size:19px}
.about div{margin:7px 0;color:var(--tx)}
.fr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;font-weight:600}
.fr .av{width:100%;aspect-ratio:1;border-radius:8px;font-size:32px}
.ph{position:relative;margin:10px -16px;min-height:220px;display:flex;align-items:center;justify-content:center;font-size:84px}
.ph i{position:absolute;left:10px;right:10px;bottom:8px;font-style:normal;font-size:12px;background:rgba(0,0,0,.55);color:#fff;padding:4px 8px;border-radius:6px;line-height:1.3}
.ph.sm{min-height:150px;font-size:56px}
.ph.ck{margin:10px -16px}
.ph.doc{background:#fff;color:#222;font:13px/1.5 monospace;flex-direction:column;align-items:flex-start;padding:14px 18px;font-size:13px}
.post .who{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.post .who .av{width:40px;height:40px;font-size:22px}
.post .who small{color:var(--mut);display:block}
.post p{margin:6px 0}
.st{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.act{display:flex;justify-content:space-around;color:var(--mut);font-weight:600;padding:8px 0 4px}
.cm{display:flex;gap:8px;margin-top:8px}.cm .av{width:32px;height:32px;font-size:16px;flex:none}
.cm div{background:var(--bg);border-radius:14px;padding:6px 12px}.cm b{display:block;font-size:13px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.post .ph img{position:static;height:auto;display:block}
.post .ph:has(img){min-height: 0}
.key{display:none}
.e .key{display:block;position:absolute;top:6px;left:6px;background:#fab005;color:#000;font-size:11px;padding:2px 6px;border-radius:4px;z-index:2}
.e [data-k]{cursor:pointer;outline:2px dashed #fab005}
.ig{max-width:935px;margin:0 auto;padding:16px}
.igh{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.igh .av{width:110px;height:110px;font-size:56px}
.igh h2{margin:0 0 8px;font-weight:400}.igh span{margin-right:18px}
.hl{display:flex;gap:16px;margin:18px 0;overflow-x:auto;font-size:12px;text-align:center}
.hl div{min-width:70px}.hl .av{width:64px;height:64px;font-size:28px;border:2px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.grid>div{min-width:0;overflow:hidden}
.grid .ph{margin:0;min-height:0;aspect-ratio:1;font-size:44px;cursor:pointer}.grid .ph i{display:none}.grid .ph.doc{font-size:8px;padding:6px;align-items:flex-start;overflow:hidden}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9;align-items:center;justify-content:center;padding:14px}
.mo{background:var(--card);border-radius:10px;max-width:480px;width:100%;max-height:92%;overflow:auto;padding:0 16px 14px}
.mo .ph{margin:0 -16px 10px}
.mo .ph:has(img){min-height:0;aspect-ratio:auto;}
.mo .ph img{position:static;width:auto;height:auto;max-width:100%;max-height: 70vh;object-fit:contain;display:block;margin:0 auto}
.li{background:#f3f2ef;--blue:#0a66c2}
.li .cover{background:linear-gradient(120deg,#0a66c2,#70b5f9);border-radius:10px 10px 0 0;height:140px}
.li .card h3{font-size:18px}.li .card hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.li .lt2{color:var(--mut);font-size:13px}
.li .tag{display:inline-block;border:1px solid var(--line);border-radius:16px;padding:3px 12px;margin:3px;font-size:13px}

.t .risk{outline:3px solid #e03131;outline-offset:-3px}
.note{display:none}
.t .note{display:block;background:#fff5f5;color:#8a1c1c;border-left:4px solid #e03131;padding:8px 12px;margin:10px -16px -14px;font-size:13px}
.t mark{background:#ffe066;color:#000;padding:0 2px}
mark{background:none;color:inherit;padding:0}
#tt{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));opacity:.25;border:0;background:none;color:var(--tx);cursor:pointer;font-size:12px}
.t #tt{opacity:1;background:#e03131;color:#fff;border-radius:8px;padding:6px 10px}
</style>
</head>

  if(p.doc) return `<div class="ph doc ${c}" data-k="${k}" role="img" aria-label="${p.d}"><div>${p.html}</div><i>📷 ${p.d}</i>${l}</div>`;
  return `<div class="ph ${c}" data-k="${k}" style="background:${p.bg}" role="img" aria-label="${p.d}">${p.e}<i>📷 ${p.d}</i>${l}</div>`}

function post(p){return `<div class="card post${cls(p.risk)}"><div class="who"><div class="av">${D.emoji}</div>

function render(){

addEventListener("click",ev=>{ /* mode ?edit=1 : remplacer une photo */
  if(!edit)return;const t=ev.target.closest("[data-k]");if(!t)return;ev.preventDefault();ev.stopPropagation();const k=t.dataset.k;
  if(ev.shiftKey){try{localStorage.removeItem("img:"+k)}catch(e){}return render()}
  const f=document.createElement("input");f.type="file";f.accept="image/*";
  f.onchange=()=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    try{localStorage.setItem("img:"+k,c.toDataURL("image/jpeg",.8))}catch(e){alert("Stockage navigateur plein")}
    render()};im.src=r.result};r.readAsDataURL(f.files[0])};f.click()},true);
$("#tt").onclick=()=>{teacher=!teacher;render()};
